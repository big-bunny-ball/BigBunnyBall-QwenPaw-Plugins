<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Turn Notifications browser verification</title></head>
<body>
  <pre id="result">Waiting…</pre>
  <script>
    window.__notifications = [];
    window.__requests = [];
    class FakeNotification {
      static permission = "granted";
      constructor(title, options) {
        window.__notifications.push({ title, body: options.body });
      }
      close() {}
    }
    window.Notification = FakeNotification;
    window.QwenPaw = {
      host: {
        getApiUrl: (path) => "http://localhost/api" + path,
        getApiToken: () => "browser-test-token"
      }
    };
    window.fetch = async (url, options) => {
      window.__requests.push({ url, authorization: options.headers.Authorization });
      const encoder = new TextEncoder();
      const body = new ReadableStream({
        start(controller) {
          controller.enqueue(encoder.encode(
            "event: stream.ready\ndata: {}\n\n" +
            "event: turn.completed\ndata: {}\n\n"
          ));
        }
      });
      return { ok: true, body };
    };
    Object.defineProperty(document, "hidden", { configurable: true, get: () => true });
    Object.defineProperty(document, "hasFocus", { configurable: true, value: () => false });
  </script>
  <script src="../web/index.js"></script>
  <script>
    window.setTimeout(() => {
      const data = {
        notificationCount: window.__notifications.length,
        notification: window.__notifications[0] || null,
        requests: window.__requests,
        uiElementCount: document.querySelectorAll("button, input, select, textarea, [role='switch']").length
      };
      document.getElementById("result").textContent = JSON.stringify(data, null, 2);
      document.body.dataset.verification = JSON.stringify(data);
    }, 250);
  </script>
</body>
</html>
